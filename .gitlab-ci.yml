stages:
  - sdk
  - compile
  - image
  - extract

variables:
  SDK_IMAGE: $CI_REGISTRY_IMAGE/buildroot-sdk
  FINAL_IMAGE: $CI_REGISTRY_IMAGE/buildroot-image

.relevant-changes: &relevant-changes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - Dockerfile
        - CMakeLists.txt
        - main/**/*
        - build.py

.kaniko-login: &kaniko-login
  - mkdir -p /kaniko/.docker
  - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

build-sdk-image:
  stage: sdk
  tags:
    - linux_amd64
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - Dockerfile
  script:
    - *kaniko-login
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --target dev
        --destination "$SDK_IMAGE:$CI_COMMIT_SHORT_SHA"
        --destination "$SDK_IMAGE:latest"

compile-app:
  stage: compile
  tags:
    - linux_amd64
  image: $SDK_IMAGE:latest
  <<: *relevant-changes
  script:
    - mkdir -p build
    - cd build
    - /buildroot/output/host/bin/cmake -DCMAKE_C_COMPILER=/buildroot/output/host/bin/aarch64-linux-gcc -DCMAKE_CXX_COMPILER=/buildroot/output/host/bin/aarch64-linux-g++ ..
    - /buildroot/output/host/bin/cmake --build .
    - cd ..
    - mkdir -p app-overlay/usr/bin
    - cp build/main/app app-overlay/usr/bin/app
  artifacts:
    paths:
      - app-overlay/

build-final-image:
  stage: image
  tags:
    - linux_amd64
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - job: compile-app
      artifacts: true
  <<: *relevant-changes
  script:
    - *kaniko-login
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --target image
        --destination "$FINAL_IMAGE:$CI_COMMIT_SHORT_SHA"
        --destination "$FINAL_IMAGE:latest"

extract-sdcard-img:
  stage: extract
  tags:
    - linux_amd64
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  needs:
    - build-final-image
  <<: *relevant-changes
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - crane export "$FINAL_IMAGE:$CI_COMMIT_SHORT_SHA" - | tar -x buildroot/output/images/sdcard.img
    - mv buildroot/output/images/sdcard.img ./sdcard.img
  artifacts:
    paths:
      - sdcard.img
